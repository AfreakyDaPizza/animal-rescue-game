name: 🐛 Bug (something is broken)
description: Something in the game doesn't work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **One bug = one Issue!**
        ⚠️ Everyone in the world can read this. No real names, school, home address, or photos of yourself.
  - type: dropdown
    id: where
    attributes:
      label: Where in the game?
      options:
        - Hub
        - Safety Zoo (your pet plots)
        - Biome 1 - Deforestation Site
        - Biome 2 - Polluted Ocean
        - Biome 3 - Bird Poaching Site
        - Biome 4 - Arctic Meltdown
        - Biome 5 - Smuggler's Compound
        - Biome 6 - Mining Mountain
        - Biome 7 - Enchanted Kingdom (and the mushroom parkour)
        - Secret Beach
        - Laboratory / Boss Arena
        - Halloween World (Ghost Town, Graveyard, Haunted House)
        - Pumpkin Reaper Dragon
        - Hell / Witch Castle
        - Endless Witch Tower
        - Catch & Tame
        - Ranger Gym
        - Cutscene
        - Shops and stalls
        - Index / Backpack / Quests / menus
        - Animals or pets
        - Bosses
        - Weapons / Skill Tree
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: did
    attributes:
      label: What did you do?
      description: The steps, one by one.
      placeholder: |
        1. Borrowed the panda in Biome 1
        2. Ran back to the Hub
        3. Pressed E at Reproduce Machine 1
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What went wrong?
      placeholder: The panda disappeared and the machine stayed empty.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: The panda should go into the machine.
    validations:
      required: true
  - type: textarea
    id: picture
    attributes:
      label: Picture (optional)
      description: Paste a screenshot. Press Win + Shift + S, then Ctrl + V here.
